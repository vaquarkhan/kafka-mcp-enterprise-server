# CI - run on pushes/PRs to main (does not publish).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Conformance (72 checks)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run conformance suite
        run: python run_tests.py
      - name: Compile check
        run: |
          python -c "import py_compile,glob;[py_compile.compile(f,doraise=True) for f in glob.glob('kafka_mcp/*.py')+glob.glob('tests/*.py')+glob.glob('*.py')];print('compile OK')"
      - name: Build sdist/wheel
        run: |
          pip install build
          python -m build
