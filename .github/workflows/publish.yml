# Publish to PyPI via Trusted Publishing (OIDC).
# Pattern mirrors vaquarkhan/mcp-test-harness `.github/workflows/publish.yml`.
#
# Trigger: git tag v*  (e.g. v0.1.0)
#
# One-time setup (you must do this — automation cannot):
# 1) GitHub → Settings → Environments → create environment named exactly: pypi
# 2) PyPI → Publishing → add Trusted Publisher (pending OK if project does not exist yet):
#      PyPI project name:  kafka-mcp-enterprise
#      Owner:              vaquarkhan
#      Repository:         kafka-mcp-enterprise-server
#      Workflow name:      publish.yml
#      Environment name:   (blank / Any — matches workflow env pypi)
# 3) No PYPI_API_TOKEN secret needed when Trusted Publishing is configured.
# Docs: https://docs.pypi.org/trusted-publishers/

name: publish

on:
  push:
    tags:
      - "v*"
  # Re-run after fixing Trusted Publisher without retagging
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to confirm a manual publish of the current ref'
        required: true
        default: 'publish'

permissions:
  contents: read
  id-token: write  # required for PyPI Trusted Publishing (OIDC)

jobs:
  test:
    name: Conformance (85 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run conformance suite
        run: python run_tests.py

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kafka-mcp-enterprise
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Generate CycloneDX SBOM
        continue-on-error: true
        run: |
          pip install "cyclonedx-bom>=4"
          pip install .
          cyclonedx-py environment --pyproject pyproject.toml --of JSON -o bom.json
      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: bom.json
          if-no-files-found: warn
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
