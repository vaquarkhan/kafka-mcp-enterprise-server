<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kafka MCP Enterprise - product image</title>
  <desc id="desc">Simple product packaging image for the Python PyPI package. Not a user interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="420" fill="#2dd4bf"/>

  <!-- logo -->
  <rect x="64" y="72" width="88" height="88" rx="20" fill="url(#mark)"/>
  <path d="M90 94 L90 138 M90 116 L112 94 M90 116 L114 138" fill="none" stroke="#042f2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 102 H138 M122 116 H142 M122 130 H134" fill="none" stroke="#042f2e" stroke-width="5" stroke-linecap="round"/>

  <text x="180" y="108" class="t" fill="#f8fafc" font-size="36" font-weight="800">Kafka MCP Enterprise</text>
  <text x="180" y="146" class="t" fill="#99f6e4" font-size="18">Python reference server for KIP-1318</text>

  <text x="64" y="220" class="t" fill="#cbd5e1" font-size="18">A stdio MCP process for governed Kafka tool access.</text>
  <text x="64" y="252" class="t" fill="#94a3b8" font-size="16">Install from PyPI. Run from the terminal. No web UI.</text>

  <!-- install box -->
  <rect x="64" y="290" width="720" height="72" rx="12" fill="#020617" stroke="#334155"/>
  <text x="88" y="322" class="mono" fill="#64748b" font-size="14">$</text>
  <text x="112" y="322" class="mono" fill="#5eead4" font-size="16">pip install kafka-mcp-enterprise-kip1318</text>
  <text x="88" y="348" class="mono" fill="#94a3b8" font-size="14">CLI: kafka-mcp-enterprise</text>

  <rect x="820" y="290" width="316" height="72" rx="12" fill="#042f2e" stroke="#14b8a6"/>
  <text x="978" y="322" text-anchor="middle" class="t" fill="#5eead4" font-size="13" font-weight="600">TRANSPORT</text>
  <text x="978" y="348" text-anchor="middle" class="t" fill="#f8fafc" font-size="20" font-weight="700">stdio JSON-RPC</text>
</svg>
